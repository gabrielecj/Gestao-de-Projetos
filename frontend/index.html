<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Visitantes</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><b>IF</b><span><strong>Campus Flow</strong><small>Controle de Visitantes</small></span></div><button onclick="openForm()">+ Registrar entrada</button></header><main><p class="eyebrow">MONITORAMENTO DE ACESSO</p><h1>Fluxo de pessoas no campus</h1><p class="muted">Indicadores calculados a partir dos registros persistidos.</p><section id="metrics"></section><div class="grid"><article><h2>Entradas por mês</h2><div id="months"></div></article><article><h2>Perfil das entradas</h2><div id="types"></div></article></div><article><div class="head"><h2>Registros</h2><input id="filter" type="date" onchange="load()"></div><table><thead><tr><th>Nome</th><th>Tipo</th><th>Faixa</th><th>Sexo</th><th>Setor</th><th>Entrada</th><th>Saída</th><th></th></tr></thead><tbody id="rows"></tbody></table></article></main><div id="modal"><form onsubmit="save(event)"><button type="button" class="x" onclick="closeForm()">×</button><h2>Registrar entrada</h2><input id="name" placeholder="Nome ou identificação" required><select id="type"><option>aluno</option><option>servidor</option><option>visitante</option><option>prestador</option><option>outros</option></select><select id="age"><option>criança</option><option>adolescente</option><option>adulto</option><option>idoso</option></select><select id="sex"><option>F</option><option>M</option><option>Outro</option></select><input id="sector" placeholder="Setor" required><input id="date" type="date" required><input id="entry" type="time" required><input id="exit" type="time"><button>Salvar</button></form></div><script src="app.js"></script></body></html>
